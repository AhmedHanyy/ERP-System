version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: smarterp_postgres
    restart: always
    environment:
      POSTGRES_USER: smarterp
      POSTGRES_PASSWORD: smarterp_secure_password
      POSTGRES_DB: smarterp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
